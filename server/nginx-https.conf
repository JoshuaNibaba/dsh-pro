# DSH Remote: https://__DOMAIN__/ -> password gateway (127.0.0.1:__GATEWAY_PORT__) -> dsh web
#
# Works directly and behind Cloudflare (SSL mode Full, or Flexible where Cloudflare
# reaches port 80 with X-Forwarded-Proto: https). Forwarded headers are trusted only
# from Cloudflare's published proxy networks (https://www.cloudflare.com/ips/), so a
# client that reaches this server directly cannot fake HTTPS or its address.
geo $realip_remote_addr $dsh_remote_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$dsh_remote_cloudflare:$http_x_forwarded_proto" $dsh_remote_request_scheme {
    default $scheme;
    "1:https" https;
}

# The visitor's address, for the gateway's login throttling.
map "$dsh_remote_cloudflare:$http_cf_connecting_ip" $dsh_remote_client_ip {
    default $remote_addr;
    "~^1:(?<dsh_remote_cf_ip>.+)$" $dsh_remote_cf_ip;
}

map $http_upgrade $dsh_remote_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 512m;

    location /.well-known/acme-challenge/ {
        root /var/www/dsh-acme;
    }
    location / {
        if ($dsh_remote_request_scheme != https) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://127.0.0.1:__GATEWAY_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_remote_connection;
        proxy_set_header X-Real-IP $dsh_remote_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dsh_remote_request_scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;

    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:__GATEWAY_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_remote_connection;
        proxy_set_header X-Real-IP $dsh_remote_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dsh_remote_request_scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
