name: DSH Remote (Windows)

on:
  push:
    branches: [main]
    paths: ['remote/windows/**', '.github/workflows/dsh-remote-windows.yml']
  pull_request:
    branches: [main]
    paths: ['remote/windows/**', '.github/workflows/dsh-remote-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-remote-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Select release signing mode
        id: mode
        env:
          RELEASE_SIGNING_MODE: ${{ vars.REMOTE_WINDOWS_SIGNING_MODE || 'none' }}
        run: |
          $mode = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { 'none' } else { $env:RELEASE_SIGNING_MODE }
          if ($mode -cnotin @('none', 'azure', 'certificate-store')) { throw 'Invalid REMOTE_WINDOWS_SIGNING_MODE.' }
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Test connection, signing guards, and release isolation
        run: |
          dotnet run --project remote/windows/Tests/DshRemote.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Connection core tests failed.' }
          ./remote/windows/Tests/signing.tests.ps1
          node --test remote/windows/Tests/signing-workflow.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Signing workflow tests failed.' }
      - name: Build application on a hosted runner
        id: build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          UPDATE_REPO: ${{ github.repository }}
          RELEASE_SIGNING_MODE: ${{ steps.mode.outputs.mode }}
          REMOTE_WINDOWS_SIGNING_MODE: none
        run: ./remote/windows/build.ps1 -BuildNumber $env:BUILD_NUMBER -Repository $env:UPDATE_REPO -StageOnly:($env:RELEASE_SIGNING_MODE -ne 'none')
      - name: Reject unsigned binaries in the signed packaging path
        env:
          PACKAGE_DIRECTORY: ${{ steps.build.outputs.directory }}/DSH Remote
        run: ./remote/windows/Tests/signing-pack.tests.ps1 -PackageDirectory $env:PACKAGE_DIRECTORY
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.mode == 'none'
        with:
          name: dsh-remote-windows-x64-none
          path: |
            ${{ steps.build.outputs.directory }}/DSH-Remote-Windows-x64.zip
            ${{ steps.build.outputs.directory }}/DSH-Remote-Windows-x64.zip.sha256
            ${{ steps.build.outputs.directory }}/DSH-Remote-Windows.version
            ${{ steps.build.outputs.directory }}/signing-status.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.mode != 'none'
        with:
          name: dsh-remote-windows-staged
          path: ${{ steps.build.outputs.directory }}
          if-no-files-found: error
          retention-days: 1

  sign_azure:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.mode == 'azure'
    needs: build
    runs-on: windows-2022
    environment: remote-windows-signing
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      REMOTE_WINDOWS_SIGNING_MODE: azure
      REMOTE_WINDOWS_SIGNER_SUBJECT: ${{ vars.REMOTE_WINDOWS_SIGNER_SUBJECT }}
      REMOTE_WINDOWS_AZURE_CLIENT_ID: ${{ vars.REMOTE_WINDOWS_AZURE_CLIENT_ID }}
      REMOTE_WINDOWS_AZURE_TENANT_ID: ${{ vars.REMOTE_WINDOWS_AZURE_TENANT_ID }}
      REMOTE_WINDOWS_AZURE_SUBSCRIPTION_ID: ${{ vars.REMOTE_WINDOWS_AZURE_SUBSCRIPTION_ID }}
      REMOTE_WINDOWS_AZURE_ENDPOINT: ${{ vars.REMOTE_WINDOWS_AZURE_ENDPOINT }}
      REMOTE_WINDOWS_AZURE_ACCOUNT_NAME: ${{ vars.REMOTE_WINDOWS_AZURE_ACCOUNT_NAME }}
      REMOTE_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.REMOTE_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dsh-remote-windows-staged
          path: ${{ runner.temp }}/remote-windows-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate signing configuration and record dependency hashes
        id: prepare
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "remote-windows-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          ./remote/windows/sign-release.ps1 -Operation prepare -PackageDirectory (Join-Path $stage 'DSH Remote')
      - name: Authenticate to Azure using OIDC
        uses: azure/login@487024fc392f1f60cc70bc8a48233c14bc1de77f
        with:
          client-id: ${{ vars.REMOTE_WINDOWS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.REMOTE_WINDOWS_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.REMOTE_WINDOWS_AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL
      - name: Sign only the three application binaries
        uses: azure/artifact-signing-action@29de24bf030cfee71b1ad0207ab4d69e74514a42
        with:
          endpoint: ${{ vars.REMOTE_WINDOWS_AZURE_ENDPOINT }}
          signing-account-name: ${{ vars.REMOTE_WINDOWS_AZURE_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.REMOTE_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ steps.prepare.outputs.package }}/DSH Remote.exe
            ${{ steps.prepare.outputs.package }}/DSH Remote.dll
            ${{ steps.prepare.outputs.package }}/DshRemote.Core.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: false
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify final signatures, self-check, and package
        id: package
        env:
          STAGE_DIRECTORY: ${{ steps.prepare.outputs.directory }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./remote/windows/pack.ps1 -OutputDirectory $env:STAGE_DIRECTORY -BuildNumber $env:BUILD_NUMBER -SigningMode azure
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-remote-windows-x64-azure
          path: |
            ${{ steps.package.outputs.directory }}/DSH-Remote-Windows-x64.zip
            ${{ steps.package.outputs.directory }}/DSH-Remote-Windows-x64.zip.sha256
            ${{ steps.package.outputs.directory }}/DSH-Remote-Windows.version
            ${{ steps.package.outputs.directory }}/signing-status.json
          if-no-files-found: error
          retention-days: 14

  sign_store:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.mode == 'certificate-store'
    needs: build
    runs-on: [self-hosted, windows, x64, remote-windows-signing]
    environment: remote-windows-signing
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      REMOTE_WINDOWS_SIGNING_MODE: certificate-store
      REMOTE_WINDOWS_SIGNER_SUBJECT: ${{ vars.REMOTE_WINDOWS_SIGNER_SUBJECT }}
      REMOTE_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.REMOTE_WINDOWS_CERTIFICATE_THUMBPRINT }}
      REMOTE_WINDOWS_CERTIFICATE_STORE_LOCATION: ${{ vars.REMOTE_WINDOWS_CERTIFICATE_STORE_LOCATION }}
      REMOTE_WINDOWS_SIGNTOOL_PATH: ${{ vars.REMOTE_WINDOWS_SIGNTOOL_PATH }}
      REMOTE_WINDOWS_TIMESTAMP_URL: ${{ vars.REMOTE_WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dsh-remote-windows-staged
          path: ${{ runner.temp }}/remote-windows-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate signing configuration and record dependency hashes
        id: prepare
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "remote-windows-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          ./remote/windows/sign-release.ps1 -Operation prepare -PackageDirectory (Join-Path $stage 'DSH Remote')
      - name: Sign using the selected certificate-store key
        env:
          PACKAGE_DIRECTORY: ${{ steps.prepare.outputs.package }}
        run: ./remote/windows/sign-release.ps1 -Operation certificate-store -PackageDirectory $env:PACKAGE_DIRECTORY
      - name: Verify final signatures, self-check, and package
        id: package
        env:
          STAGE_DIRECTORY: ${{ steps.prepare.outputs.directory }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./remote/windows/pack.ps1 -OutputDirectory $env:STAGE_DIRECTORY -BuildNumber $env:BUILD_NUMBER -SigningMode certificate-store
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-remote-windows-x64-certificate-store
          path: |
            ${{ steps.package.outputs.directory }}/DSH-Remote-Windows-x64.zip
            ${{ steps.package.outputs.directory }}/DSH-Remote-Windows-x64.zip.sha256
            ${{ steps.package.outputs.directory }}/DSH-Remote-Windows.version
            ${{ steps.package.outputs.directory }}/signing-status.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' &&
      ((needs.build.outputs.mode == 'none' && needs.sign_azure.result == 'skipped' && needs.sign_store.result == 'skipped') ||
      (needs.build.outputs.mode == 'azure' && needs.sign_azure.result == 'success' && needs.sign_store.result == 'skipped') ||
      (needs.build.outputs.mode == 'certificate-store' && needs.sign_store.result == 'success' && needs.sign_azure.result == 'skipped'))
    needs: [build, sign_azure, sign_store]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsh-remote-windows-x64-${{ needs.build.outputs.mode }}
          path: remote/build/windows-release
      - name: Publish Windows rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: dsh-remote-windows
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_MODE: ${{ needs.build.outputs.mode }}
        working-directory: remote/build/windows-release
        run: |
          set -euo pipefail
          sha256sum --check DSH-Remote-Windows-x64.zip.sha256
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          record = json.loads(Path('signing-status.json').read_text(encoding='utf-8-sig'))
          mode = os.environ['SIGNING_MODE']
          assert mode in ('none', 'azure', 'certificate-store'), 'Invalid signing mode'
          assert record['Schema'] == 1 and record['Mode'] == mode, 'Wrong signing artifact'
          assert record['Signed'] is (mode != 'none'), 'Wrong signature status'
          assert record['BuildNumber'] == int(os.environ['BUILD_NUMBER']), 'Wrong build number'
          assert Path('DSH-Remote-Windows.version').read_text().strip() == os.environ['BUILD_NUMBER'], 'Wrong update version'
          assert record['ZipSHA256'] == hashlib.sha256(Path('DSH-Remote-Windows-x64.zip').read_bytes()).hexdigest(), 'Wrong package digest'
          if mode != 'none':
              assert sorted(item['Name'] for item in record['Files']) == ['DSH Remote.dll', 'DSH Remote.exe', 'DshRemote.Core.dll'], 'Incomplete signature verification'
              assert all(item['Subject'] and item['Thumbprint'] and item['TimestampThumbprint'] for item in record['Files']), 'Missing verified signer or timestamp'
          else:
              assert record['Files'] == [], 'Unsigned artifact cannot claim signature verification'
          PY
          case "$SIGNING_MODE" in
            none) signing_note='此便携包未进行 Authenticode 签名，Windows 可能显示未知发布者提示。' ;;
            azure) signing_note='三份自有应用 EXE/DLL 已通过 Azure Artifact Signing 签名，并验证发布者、信任链和时间戳；第三方运行时文件保持原样。' ;;
            certificate-store) signing_note='三份自有应用 EXE/DLL 已使用指定证书存储密钥签名，并验证发布者、信任链和时间戳；第三方运行时文件保持原样。' ;;
            *) exit 1 ;;
          esac
          previous="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          git push --force-with-lease="refs/tags/$RELEASE_TAG:$previous" origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"
          title="DSH Remote 1.0.$BUILD_NUMBER (Windows 客户端)"
          cat > release-notes.md <<EOF
          DSH Remote for Windows 1.0.$BUILD_NUMBER，构建自 $GITHUB_SHA。

          下载 **DSH-Remote-Windows-x64.zip**，完整解压后运行 **DSH Remote.exe**。支持 Windows 10/11 x64，已包含 .NET 运行时，无需安装 .NET SDK。

          - 网页地址与密码登录、保持登录状态；可选 OpenSSH 密钥隧道、断线重连。
          - 连接设置、服务器日志、重启服务、外部浏览器、主题适配和更新提醒。
          - 需要 Microsoft Edge WebView2 Runtime；缺少时客户端提供官方下载入口。SSH 模式另需 Windows OpenSSH 客户端。
          - $signing_note
          - 签名不保证消除 SmartScreen 提示，Windows 仍会根据信誉和设备策略判断。SHA-256 校验文件随包发布。

          安装、SSH 配置和限制见 [Windows 使用说明](https://github.com/$GITHUB_REPOSITORY/blob/main/remote/windows/README.zh.md)。更新时退出旧客户端，将新版本解压到新目录；连接设置和登录状态保存在当前用户的 AppData 中。

          Windows assets and update checks use this release independently of the Mac release. Final files are dependency-checked on Windows; no browser E2E automation is used by this workflow.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" DSH-Remote-Windows-x64.zip DSH-Remote-Windows-x64.zip.sha256 --clobber
            gh release upload "$RELEASE_TAG" DSH-Remote-Windows.version --clobber
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file release-notes.md --latest=false --prerelease=false
          else
            gh release create "$RELEASE_TAG" DSH-Remote-Windows-x64.zip DSH-Remote-Windows-x64.zip.sha256 DSH-Remote-Windows.version \
              --title "$title" --notes-file release-notes.md --latest=false
          fi
